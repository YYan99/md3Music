name: macOS 测试包

on:
  push:
    branches: [codex/macos-port]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: 准备 Rust 构建目标
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: 使用本机钥匙串验证手机号登录与跨进程恢复
        run: |
          flutter build macos --release --target test/macos/login_restart_app.dart
          python3 - <<'PY'
          import os
          import subprocess

          executable = "build/macos/Build/Products/Release/md3music.app/Contents/MacOS/md3music"
          for phase in ("write", "restore"):
              run = subprocess.run([executable], env={**os.environ, "MD3_LOGIN_RESTART_PHASE": phase},
                                   check=True, timeout=90, stdout=subprocess.PIPE, text=True)
              if f"MD3_LOGIN_TEST_OK={phase}" not in run.stdout.splitlines():
                  raise RuntimeError(f"测试进程未完成 {phase}")
              print(f"测试阶段通过：{phase}")
          PY
      - name: 构建发布版
        run: flutter build macos --release
      - name: 验证应用签名、架构和包内服务
        run: |
          app=build/macos/Build/Products/Release/md3music.app
          lib="$app/Contents/Frameworks/libkugou_server.dylib"
          codesign --verify --deep --strict --verbose=2 "$app"
          for arch in $(lipo -archs "$app/Contents/MacOS/md3music"); do
            lipo "$lib" -verify_arch "$arch"
          done
          python3 - "$lib" <<'PY'
          import ctypes
          import sys
          import tempfile
          from http.client import HTTPConnection

          service = ctypes.CDLL(sys.argv[1])
          service.start_server.argtypes = [ctypes.c_int, ctypes.c_char_p]
          with tempfile.TemporaryDirectory() as data:
              port = service.start_server(0, data.encode())
              assert port > 0 and service.is_server_running()
              try:
                  client = HTTPConnection("127.0.0.1", port, timeout=10)
                  client.request("OPTIONS", "/search")
                  assert client.getresponse().status == 204
                  client.close()
              finally:
                  service.stop_server()
          PY
          "$app/Contents/MacOS/md3music" >"$RUNNER_TEMP/md3music.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in {1..60}; do
            kill -0 "$pid" || { tail -40 "$RUNNER_TEMP/md3music.log"; exit 1; }
            port=$(lsof -nP -a -p "$pid" -iTCP -sTCP:LISTEN -Fn | sed -n 's/^n127\.0\.0\.1://p' | head -1) || true
            if [[ -n "$port" ]] && [[ $(curl -s -o /dev/null -w '%{http_code}' -X OPTIONS "http://127.0.0.1:$port/search") == 204 ]]; then
              break
            fi
            port=''
            sleep 1
          done
          test -n "$port" || { tail -40 "$RUNNER_TEMP/md3music.log"; exit 1; }
          # 在线曲库受运行地区和服务可用性影响，独立记录试搜结果。
          if curl -fsS --max-time 20 "http://127.0.0.1:$port/search?keywords=Yesterday&pagesize=3" |
            jq -e '(.data // .) | (.lists // .songs // .info // []) | any(.[]; .FileHash or .hash or .SongName or .songname)' >/dev/null; then
            echo '打包后的应用在线搜歌成功。' | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo '本地服务已通过验证，在线试搜未取得曲目，需在测试机复核。' | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          ditto -c -k --keepParent "$app" md3music-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: md3music-macos
          path: md3music-macos.zip
          if-no-files-found: error
          retention-days: 30
